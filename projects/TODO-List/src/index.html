<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TODO-List</title>
</head>
<body>
  <main>

    <div class="todo-component">
      <nav class="todo-component__nav">
        <button type="button" class="btn" id="groups-tab-btn" data-for-tab="groups">Groups</button>
        <button type="button" class="btn" id="notes-tab-btn" data-for-tab="notes">Notes</button>
      </nav>
      <div class="todo-component__tabs">
        <ul class="groups" id="groups-id">
          
          <li class="group">
            <span class="group__title">Shopping</span>
            <button class="btn">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 10 10">
                <circle r="0.5" cx="5" cy="2.1" stroke="white" fill="white"></circle>
                <circle r="0.5" cx="5" cy="5.1" stroke="white" fill="white"></circle>
                <circle r="0.5" cx="5" cy="8.1" stroke="white" fill="white"></circle>
              </svg> 
            </button>
          </li>
        </ul>

        <!-- <ul class="notes" id="notes-id">
          <li class="note"></li>
        </ul> -->
      </div>
    </div>
  </main>
</body>
</html>
