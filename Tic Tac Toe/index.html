<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./src/index.css">
    <script defer src="src/js/app.js"></script>
  </head>
  <body>
    <main>
      <h1>Tic Tac Toe</h1>
      
      <div class="controls" id="controls-id">
        <button type="button" class="btn btn--start" id="start-btn">Start</button>
        <button type="button" class="btn btn--reset hidden" id="reset-btn">Reset</button>
      </div>

      <div id="board-id"></div>
      
      <span class="winner" id="winner-id"></span>
      
      <dialog id="popover">
        <form method="dialog">
          <h1>Create players</h1>
          
          <label for="player-one" id="player-label">Player 1</label>
          <input type="text" name="player-one" id="player-one">

          <label for="player-two" id="player-label">Player 2</label>
          <input type="text" name="player-two" id="player-two">

          <button class="btn btn--popover" type="submit" id="submit-button">Submit</button>
          <button class="btn btn--popover" type="button" id="cancel-button">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 10 10">
              <path d="M 3.5 3.5 L 6.5 6.5" stroke="white" stroke-width=".75" stroke-linecap="round"/>              
              <path d="M 6.5 3.5 L 3.5 6.5" stroke="white" stroke-width=".75" stroke-linecap="round"/>              
            </svg>
          </button>
        </form>
      </dialog>
    </main>
  </body>
</html>
